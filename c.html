<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dear Liz｜拍攝確認單</title>
<meta name="theme-color" content="#F3ECE3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #F3ECE3; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 500 28px/1.4 Georgia, "Times New Roman", serif; letter-spacing: 6px; color: #7E6F67; background: #F3ECE3; transition: opacity .4s; }
  .load.off { opacity: 0; pointer-events: none; }
  .fail { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #F3ECE3;
    font: 15px/1.7 "PingFang TC", "Noto Sans TC", sans-serif; color: #3F3632; text-align: center; padding: 0 28px; }
  .fail.on { display: flex; }
  .fail .box { max-width: 300px; }
  .fail .logo { font: 500 22px Georgia, serif; letter-spacing: 5px; color: #7E6F67; margin-bottom: 18px; }
  .fail p { color: #8C7F78; font-size: 13px; margin: 6px 0 16px; }
  .fail a { display: block; border-radius: 10px; padding: 10px; margin: 8px 0; font-size: 14px; text-decoration: none; background: #8B6F5E; color: #fff; }
  .fail a.light { background: #fff; color: #8B6F5E; border: 1px solid #E6DCD2; }
</style>
</head>
<body>
<div class="load" id="load">DEAR LIZ</div>
<iframe id="app" allow="clipboard-write"></iframe>
<div class="fail" id="fail"><div class="box">
  <div class="logo">DEAR LIZ</div>
  <div>確認單暫時無法開啟</div>
  <p>系統維護中，請稍後再試，或直接聯絡我們，我們會提供您的確認單。</p>
  <a href="" onclick="location.reload(); return false;">重新整理</a>
  <a class="light" id="line" href="#">LINE 聯絡我們</a>
</div></div>
<script>
  // 客人短連結：c.html?短碼 → Dear Liz 系統的客人確認單頁
  var APP = 'https://script.google.com/macros/s/AKfycbxm_EpAobBBB8ryXHnyowXO0bHRpQQQ6QPTMe_azHbS169dHxOKFgS92g-IeSPZF7O9qA/exec';
  var code = (location.search.replace(/^\?/, '').split('&')[0] || location.hash.replace(/^#/, '')).replace(/[^A-Za-z0-9]/g, '');
  var f = document.getElementById('app');
  // 官方 LINE 連結（空白就不顯示「LINE 聯絡我們」按鈕）
  var LINE = '';
  var line = document.getElementById('line');
  if (LINE) line.href = LINE; else line.style.display = 'none';
  // 20 秒還沒載入、或沒有短碼 → 顯示「暫時無法開啟」，不要一直空白
  var fail = function () { document.getElementById('load').classList.add('off'); document.getElementById('fail').classList.add('on'); };
  var timer = setTimeout(fail, 20000);
  f.onload = function () { clearTimeout(timer); document.getElementById('load').classList.add('off'); };
  if (code) f.src = APP + '?k=' + encodeURIComponent(code); else fail();
</script>
</body>
</html>
